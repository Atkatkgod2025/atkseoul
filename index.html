<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首爾秋日楓葉之旅 2026 🍁</title>
    <!-- Google Fonts: Zen Maru Gothic & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-washi: #FFFCF6;
            --card-bg: #FFFFFF;
            --ink-black: #2C2C2C;
            --coral-red: #E06D53;
            --coral-soft: #FDF0ED;
            --yamabuki-yellow: #E2A03F;
            --yamabuki-soft: #FCF6E8;
            --mizu-blue: #5C8D89;
            --mizu-soft: #EEF4F3;
            --wakatake-green: #688E67;
            --wakatake-soft: #EFF4EF;
            --border-color: #383838;
            --shadow-color: rgba(56, 56, 56, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-washi);
            color: var(--ink-black);
            padding: 16px 12px 60px 12px;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
            background-image: radial-gradient(#E8E3D9 1px, transparent 1px);
            background-size: 16px 16px;
        }

        /* 頂部標題與成員切換按鈕 */
        header {
            text-align: center;
            margin-bottom: 16px;
            padding: 18px 14px;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 4px 4px 0px var(--border-color);
            position: relative;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--ink-black);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-subtitle {
            font-size: 0.82rem;
            color: #666;
            margin-top: 4px;
            font-weight: 700;
        }

        /* 切換人選 Tabs */
        .traveler-selector {
            display: flex;
            background: #EFECE6;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 4px;
            margin-top: 14px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #666;
            background: transparent;
        }

        .tab-btn.active {
            background: var(--coral-red);
            color: white;
            box-shadow: 2px 2px 0px var(--border-color);
            border: 2px solid var(--border-color);
        }

        /* 天數分頁導航 */
        .day-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .day-nav::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            flex: 0 0 auto;
            min-width: 58px;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
            transition: all 0.15s ease;
        }

        .day-btn.active {
            background: var(--yamabuki-yellow);
            color: white;
            transform: translateY(-2px);
            box-shadow: 2px 4px 0px var(--border-color);
        }

        /* 資訊卡片 */
        .info-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px dashed #E0E0E0;
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 800;
        }

        .hotel-tag {
            background: var(--mizu-soft);
            color: var(--mizu-blue);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            border: 1px solid var(--mizu-blue);
        }

        .flight-badge {
            background: var(--coral-soft);
            color: var(--coral-red);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            border: 1px solid var(--coral-red);
        }

        /* 複製地址專用按鈕 */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            padding: 4px 8px;
            background: #F0F0F0;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--ink-black);
        }

        .copy-btn:active {
            background: #DDD;
        }

        /* 行程時間軸 */
        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 10px;
            bottom: 10px;
            width: 3px;
            background: var(--border-color);
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 14px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 3px 3px 0px var(--border-color);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--yamabuki-yellow);
            border: 2px solid var(--border-color);
        }

        .time-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 6px;
            background: var(--wakatake-soft);
            color: var(--wakatake-green);
            border: 1px solid var(--wakatake-green);
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .item-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--ink-black);
        }

        .item-desc {
            font-size: 0.8rem;
            color: #555;
            margin-top: 4px;
            line-height: 1.4;
        }

        .highlight-box {
            background: #FFFCEB;
            border: 1.5px dashed var(--yamabuki-yellow);
            border-radius: 8px;
            padding: 6px 8px;
            margin-top: 6px;
            font-size: 0.75rem;
            color: #7A5B00;
            font-weight: 700;
        }

        /* 隨手筆記/備忘格 (Interactive Remarks Box) */
        .remarks-section {
            margin-top: 16px;
            background: var(--yamabuki-soft);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 3px 3px 0px var(--border-color);
        }

        .remarks-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--ink-black);
            margin-bottom: 6px;
        }

        .save-status {
            font-size: 0.7rem;
            color: var(--wakatake-green);
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-status.show {
            opacity: 1;
        }

        .remarks-textarea {
            width: 100%;
            height: 70px;
            background: white;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.8rem;
            color: var(--ink-black);
            resize: none;
            outline: none;
        }

        .remarks-textarea:focus {
            border-color: var(--coral-red);
        }

        /* 購物 CheckList */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed #E5E5E5;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--coral-red);
            cursor: pointer;
        }

        /* 底部註腳 */
        footer {
            text-align: center;
            font-size: 0.72rem;
            color: #888;
            margin-top: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- 標題與成員切換 -->
    <header>
        <div class="header-title">🍁 首爾秋日賞楓之旅 2026</div>
        <div class="header-subtitle" id="trip-dates-subtitle">2026.11.01 – 2026.11.04 (3日2夜快閃)</div>
        
        <div class="traveler-selector">
            <button class="tab-btn active" id="btn-oscar" onclick="switchTraveler('oscar')">Oscar (11/1-11/4 快閃)</button>
            <button class="tab-btn" id="btn-mum" onclick="switchTraveler('mum')">Nic & Mum (11/1-11/7 漫遊)</button>
        </div>
    </header>

    <!-- 天數導航 -->
    <div class="day-nav" id="day-nav-container">
        <!-- JS 自動產生 Day 按鈕 -->
    </div>

    <!-- 酒店與航班概覽 -->
    <div class="info-card">
        <div class="card-header">
            <span>🏨 住宿與航班資訊</span>
            <span class="flight-badge" id="flight-badge-info">HX622 / HX625</span>
        </div>
        <div style="font-size: 0.85rem; font-weight: 800;" id="hotel-name-cn">🏨 明洞相鐵 FRESA INN</div>
        <div style="font-size: 0.75rem; color: #666;" id="hotel-name-en">Sotetsu Fresa Inn Seoul Myeongdong</div>
        <div style="font-size: 0.75rem; color: #888; margin-top: 2px;" id="hotel-address-kr">서울특별시 중구 明洞9길 36</div>
        
        <button class="copy-btn" onclick="copyHotelAddress()">
            📋 複製酒店韓文地址 (給司機/Naver Map)
        </button>
    </div>

    <!-- 每日行程時間軸 -->
    <div class="info-card">
        <div class="card-header">
            <span id="current-day-title">📅 DAY 1 · 11月1日 (日)</span>
            <span class="hotel-tag" id="current-day-tag">抵達首爾 & 明洞夜市</span>
        </div>

        <div class="timeline" id="timeline-container">
            <!-- JS 渲染時間軸內容 -->
        </div>

        <!-- 互動筆記備忘格 -->
        <div class="remarks-section">
            <div class="remarks-header">
                <span>📝 每日隨手筆記 / 戰利品記賬</span>
                <span class="save-status" id="save-status-indicator">✅ 已自動儲存</span>
            </div>
            <textarea class="remarks-textarea" id="daily-remarks-input" placeholder="按此輸入今日花費、買咗嘅嘢或者隨手筆記..." oninput="autoSaveRemarks()"></textarea>
        </div>
    </div>

    <!-- 購物 & 打卡 CheckList -->
    <div class="info-card">
        <div class="card-header">
            <span>🛒 必買與待辦 CheckList</span>
        </div>
        <div id="checklist-container">
            <div class="checklist-item"><input type="checkbox" id="c1"><label for="c1">和談林楓葉門票 (預先確認 QR)</label></div>
            <div class="checklist-item"><input type="checkbox" id="c2"><label for="c2">韓國傳統棉被 (廣藏市場 88號店)</label></div>
            <div class="checklist-item"><input type="checkbox" id="c3"><label for="c3">Olive Young 護膚品 & 保濕面膜</label></div>
            <div class="checklist-item"><input type="checkbox" id="c4"><label for="c4">Daiso 弘大/明洞大樓採購小工具</label></div>
            <div class="checklist-item"><input type="checkbox" id="c5"><label for="c5">東大門 DDP 現代 Outlet 逛街</label></div>
        </div>
    </div>

    <footer>
        🍁 祝你地首爾之旅玩得開心，買得滿足！🍁
    </footer>

                            { time: "14:00", title: "返回首爾市區 & 廣藏市場", desc: "品嚐綠豆餅、生牛肉、生章魚，前往 88 號店挑選韓國傳統棉被。" },
                            { time: "18:00", title: "東大門 DDP & 現代 Outlet", desc: "晚上逛 DDP 建築夜景與東大門周邊商圈。" }
                        ]
                    },
                    {
                        dayNum: 3,

                        title: "弘大購物 & Daiso 採購",

                            { time: "10:00", title: "弘大入口商圈逛街", desc: "逛美妝店、潮流服飾店與質感 Cafe 享用 Brunch。" },
                            { time: "14:00", title: "Daiso 大樓 & Olive Young 補貨", desc: "大採購生活小物與護膚保養品。" },
                            { time: "18:00", title: "前往仁川機場 & 返港", desc: "乘搭 AREX 前往機場，乘搭 HX625 (23:05) 返回香港。" }

                ]
            },

                hotelCn: "🏨 首爾東大門美居大使酒店",
                hotelEn: "Mercure Ambassador Seoul Dongdaemun",
                hotelKr: "서울특별시 중구 율곡로 308 (종로6가 289-3)",

                    {
                        dayNum: 1,

                        title: "抵達首爾 & 東大門夜遊",

                            { time: "17:55", title: "抵達仁川國際機場 (ICN)", desc: "乘搭 HX622 抵達，辦理入境與拿行李。" },
                            { time: "19:30", title: "入住首爾東大門美居大使酒店", desc: "乘搭機場巴士 6001 或 AREX 抵達酒店 Check-in。" },
                            { time: "20:30", title: "東大門美食街", desc: "享用陳玉華一隻雞或東大門烤肉。" }

                    {

                        title: "🍁 和談林賞楓 & 廣藏市場",

                            { time: "07:30", title: "前往和談林賞楓", desc: "一同前往昆池岩和談林欣賞滿山紅葉景致。" },
                            { time: "14:00", title: "廣藏市場體驗", desc: "逛傳統市場、食綠豆餅、選購韓國優質傳統棉被。" }
                        ]
                    },
                    {
                        dayNum: 3,
                        date: "11月3日 (二)",
                        title: "弘大逛街 & Daiso 購物",

                    {
                        dayNum: 4,
                        date: "11月4日 (三)",
                        title: "景福宮韓服 & 三清洞安國",
                        items: [
                            { time: "10:00", title: "景福宮賞楓 & 韓服體驗", desc: "穿著韓國傳統韓服在古宮紅葉下打卡拍照。" },
                            { time: "13:00", title: "土俗村參雞湯", desc: "品嚐首爾最受歡迎的濃郁人蔘雞湯。" },
                            { time: "15:00", title: "三清洞 & 安國 Onion Cafe", desc: "漫步傳統韓屋村，享用韓屋烘焙咖啡。" }

                    },
                    {
                        dayNum: 5,

                        title: "汝矣島現代百貨 & 江南星空圖書館",

                            { time: "15:30", title: "COEX 星空圖書館 (Starfield Library)", desc: "打卡宏偉的巨型書架與地下商圈。" },
                            { time: "19:00", title: "首爾塔夜景", desc: "乘搭纜車登上 N 首爾塔觀賞首爾璀璨夜景。" }
                        ]
                    },
                    {
                        dayNum: 6,
                        date: "11月6日 (五)",
                        title: "樂天超市大採購 & 明洞商圈",
                        items: [
                            { time: "10:30", title: "首爾站樂天超市 (Lotte Mart)", desc: "採購韓國零食、紫菜、拉麵與伴手禮 (提供現場打包服務)。" },
                            { time: "15:00", title: "明洞樂天百貨 & 美妝街", desc: "最後補貨，晚上享用精緻韓式燒肉。" }
                        ]
                    },
                    {
                        dayNum: 7,
                        date: "11月7日 (六)",
                        title: "輕鬆退房 & 返港",
                        items: [
                            { time: "08:30", title: "酒店 Check-out & 前往機場", desc: "乘搭機場巴士或 AREX 前往仁川機場。" },
                            { time: "12:00", title: "乘搭 HX629 返港", desc: "滿載而歸，順利返抵香港！" }
                        ]
                    }
                ]
            }
        };

        let currentTraveler = 'oscar';
        let currentDayIndex = 0;

        // 初始化
        function initApp() {
            renderTravelerInfo();
            renderDayNav();
            renderDayTimeline();
        }

        // 切換人員
        function switchTraveler(traveler) {
            currentTraveler = traveler;
            currentDayIndex = 0;

            document.getElementById('btn-oscar').classList.toggle('active', traveler === 'oscar');
            document.getElementById('btn-mum').classList.toggle('active', traveler === 'mum');

            renderTravelerInfo();
            renderDayNav();
            renderDayTimeline();
        }

        // 渲染人員與酒店資訊
        function renderTravelerInfo() {
            const data = tripData[currentTraveler];
            document.getElementById('trip-dates-subtitle').innerText = data.subtitle;
            document.getElementById('flight-badge-info').innerText = data.flight;
            document.getElementById('hotel-name-cn').innerText = data.hotelCn;
            document.getElementById('hotel-name-en').innerText = data.hotelEn;
            document.getElementById('hotel-address-kr').innerText = data.hotelKr;
        }

        // 渲染天數按鈕
        function renderDayNav() {
            const container = document.getElementById('day-nav-container');
            container.innerHTML = '';
            const days = tripData[currentTraveler].days;

            days.forEach((day, index) => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${index === currentDayIndex ? 'active' : ''}`;
                btn.innerText = `Day ${day.dayNum}`;
                btn.onclick = () => {
                    currentDayIndex = index;
                    updateActiveDayNav();
                    renderDayTimeline();
                };
                container.appendChild(btn);
            });
        }

        function updateActiveDayNav() {
            const btns = document.querySelectorAll('.day-btn');
            btns.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === currentDayIndex);
            });
        }

        // 渲染時間軸與讀取備忘錄
        function renderDayTimeline() {
            const dayData = tripData[currentTraveler].days[currentDayIndex];
            document.getElementById('current-day-title').innerText = `📅 DAY ${dayData.dayNum} · ${dayData.date}`;
            document.getElementById('current-day-tag').innerText = dayData.title;

            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            dayData.items.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'timeline-item';
                itemEl.innerHTML = `
                    <span class="time-badge">⏰ ${item.time}</span>
                    <div class="item-title">${item.title}</div>
                    <div class="item-desc">${item.desc}</div>
                    ${item.highlight ? `<div class="highlight-box">${item.highlight}</div>` : ''}
                `;
                container.appendChild(itemEl);
            });

            // 讀取這一天儲存的 Remarks
            loadRemarks();
        }

        // 複製地址功能
        function copyHotelAddress() {
            const address = tripData[currentTraveler].hotelKr;
            navigator.clipboard.writeText(address).then(() => {
                alert('✅ 酒店韓文地址已複製到剪貼簿：\n' + address);
            }).catch(err => {
                alert('複製失敗，請手動複製：\n' + address);
            });
        }

        // 自動儲存與讀取 LocalStorage Remarks
        function getRemarksStorageKey() {
            return `seoul_remarks_${currentTraveler}_day_${currentDayIndex + 1}`;
        }

        function loadRemarks() {
            const key = getRemarksStorageKey();
            const savedText = localStorage.getItem(key) || '';
            document.getElementById('daily-remarks-input').value = savedText;
        }

        let saveTimer;
        function autoSaveRemarks() {
            const text = document.getElementById('daily-remarks-input').value;
            const key = getRemarksStorageKey();
            localStorage.setItem(key, text);

            const indicator = document.getElementById('save-status-indicator');
            indicator.classList.add('show');
            
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                indicator.classList.remove('show');
            }, 1500);
        }

        // 執行初始化
        initApp();
    </script>
</body>
</html>
